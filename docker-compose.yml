version: '3.8'

services:
  # Django application with Gunicorn
  django:
    build: .
    container_name: hef_django
    restart: unless-stopped
    env_file:
      - backend/.env
    ports:
      - "8000:8000"
    volumes:
      - static_files:/app/backend/staticfiles
      - media_files:/app/backend/media
      - cdn_files:/app/cdn
      - history_data:/app/data/History
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hef_network
    healthcheck:
      test: ["CMD", "python", "backend/manage.py", "check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: hef_postgres
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-hef}
      - POSTGRES_USER=${POSTGRES_USER:-hef}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - hef_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hef}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis cache
  redis:
    image: redis:7-alpine
    container_name: hef_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - hef_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  static_files:
    driver: local
  media_files:
    driver: local
  cdn_files:
    driver: local
  history_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  hef_network:
    driver: bridge
