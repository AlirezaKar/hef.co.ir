{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}پورتال تاریخچه HEF{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: '#0a0a0f',
            panel: '#18181b',
            line: '#27272a',
            muted: '#a1a1aa',
            accent: '#e4e4e7',
            teal: '#2cb4c9',
          },
          fontFamily: {
            sans: ['Vazirmatn', 'Tahoma', 'Segoe UI', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/site.css' %}?v=7">
  <script>
    // Auth/error pages: if framed, break out to avoid nested UI.
    if (window.top !== window.self) {
      window.top.location.replace(window.location.href);
    }
  </script>
  {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}bg-slate-100 text-slate-900{% endblock %}">
  {% if messages %}
  <div class="toast-stack">
    {% for message in messages %}
    <div class="toast-item toast-{{ message.tags }}">{{ message }}</div>
    {% endfor %}
  </div>
  {% endif %}
  {% block body %}{% endblock %}
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'js/site.js' %}?v=2"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
