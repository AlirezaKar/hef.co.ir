{% load static %}
<!DOCTYPE html>
<html lang="{{ ui_html_lang|default:'fa' }}" dir="{{ ui_dir|default:'rtl' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}HEF{% endblock %}</title>
  <link rel="icon" href="{% static 'img/hef.co.ir.jpg' %}?v=2" type="image/jpeg">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: '#0a0a0f',
            panel: '#18181b',
            line: '#27272a',
            muted: '#a1a1aa',
            accent: '#e4e4e7',
            teal: '#2cb4c9',
          },
          fontFamily: {
            sans: ['Tahoma', 'Segoe UI', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>
  {% if ui_dir == 'ltr' %}
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  {% else %}
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  {% endif %}
  <link rel="stylesheet" href="{% static 'css/site.css' %}?v=16">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("hef-ui-theme");
        if (t === "dark") {
          document.documentElement.classList.add("theme-dark");
          document.documentElement.setAttribute("data-bs-theme", "dark");
        }
      } catch (e) {}
    })();
  </script>
  <script>
    if (window.top !== window.self) {
      window.top.location.replace(window.location.href);
    }
  </script>
  {% block extra_head %}{% endblock %}
</head>
<body class="site-body lang-{{ ui_lang|default:'fa' }} {% block body_class %}bg-slate-100 text-slate-900{% endblock %}">
  {% if messages %}
  <div class="toast-stack">
    {% for message in messages %}
    <div class="toast-item toast-{{ message.tags }}">{{ message }}</div>
    {% endfor %}
  </div>
  {% endif %}
  {% block body %}{% endblock %}
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'js/site.js' %}?v=4"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
