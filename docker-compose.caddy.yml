# Production: Postgres + Gunicorn + Caddy (Let's Encrypt HTTPS)
# Usage:
#   MY_DOMAIN=your.domain.com docker compose -f docker-compose.caddy.yml up -d --build
# Or put MY_DOMAIN in .env and run:
#   docker compose -f docker-compose.caddy.yml up -d --build

services:
  postgres:
    image: postgres:15
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hef}
      POSTGRES_USER: ${POSTGRES_USER:-hef}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hef}
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hef} -d ${POSTGRES_DB:-hef}"]
      interval: 5s
      timeout: 5s
      retries: 10

  django:
    build: .
    image: hef-portal:latest
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-hef}
      POSTGRES_USER: ${POSTGRES_USER:-hef}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hef}
      DJANGO_STATIC_ROOT: /var/www/static
      DJANGO_MEDIA_ROOT: /var/www/media
      HISTORY_ROOT: /data/History
      DJANGO_ALLOWED_HOSTS: ${MY_DOMAIN},${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: https://${MY_DOMAIN}
      DJANGO_SESSION_COOKIE_SECURE: "true"
      DJANGO_CSRF_COOKIE_SECURE: "true"
      DJANGO_SECURE_SSL_REDIRECT: "true"
      DJANGO_DEBUG: "False"
    restart: unless-stopped
    volumes:
      - staticfiles-data:/var/www/static
      - media-data:/var/www/media
      - ./data/History:/data/History
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"

  caddy:
    image: caddy:2.7-alpine
    env_file: .env
    environment:
      MY_DOMAIN: ${MY_DOMAIN}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - type: volume
        source: media-data
        target: /usr/share/caddy/media
        read_only: true
      - type: volume
        source: staticfiles-data
        target: /usr/share/caddy/static
        read_only: true
    depends_on:
      - django

volumes:
  postgres-data:
  media-data:
  staticfiles-data:
  caddy-data:
  caddy-config:
