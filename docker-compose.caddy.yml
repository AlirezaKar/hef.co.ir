# Production: Postgres + Redis + Gunicorn + Caddy (Let's Encrypt HTTPS)
# Usage:
#   docker compose -f docker-compose.caddy.yml up -d --build
# MY_DOMAIN must be set in backend/.env
#
# Auto-restart: every service uses restart: unless-stopped so Docker brings
# containers back after crashes and after host/VM reboot (if docker.service is enabled).
#
# Responsibilities:
#   - Caddy: reverse proxy, TLS/Let's Encrypt, static/media files
#   - Gunicorn (django): WSGI app server
#   - Postgres: primary database
#   - Redis: Django cache (+ cached_db sessions)

services:
  postgres:
    image: postgres:15
    env_file: backend/.env
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hef -d hef"]
      interval: 5s
      timeout: 5s
      retries: 10

  # In-memory cache for Django. Internal-only (no host port publish).
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  django:
    build: .
    image: hef-portal:latest
    env_file: backend/.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "1"
      REDIS_URL: redis://redis:6379/1
      DJANGO_STATIC_ROOT: /var/www/static
      DJANGO_MEDIA_ROOT: /var/www/media
      HISTORY_ROOT: /data/History
      DJANGO_SESSION_COOKIE_SECURE: "true"
      DJANGO_CSRF_COOKIE_SECURE: "true"
      DJANGO_SECURE_SSL_REDIRECT: "true"
      DJANGO_DEBUG: "False"
    restart: unless-stopped
    volumes:
      - staticfiles-data:/var/www/static
      - media-data:/var/www/media
      - ./data/History:/data/History
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"

  caddy:
    image: caddy:2.7-alpine
    env_file: backend/.env
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - type: volume
        source: media-data
        target: /usr/share/caddy/media
        read_only: true
      - type: volume
        source: staticfiles-data
        target: /usr/share/caddy/static
        read_only: true
    depends_on:
      - django

volumes:
  postgres-data:
  redis-data:
  media-data:
  staticfiles-data:
  caddy-data:
  caddy-config:
